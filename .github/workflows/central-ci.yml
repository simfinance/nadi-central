name: Central CI

on:
  pull_request:
  push:
    branches:
      - security/telemetry-capability-enforcement
      - main

jobs:
  php-tests:
    runs-on: ubuntu-latest

    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: root
          MYSQL_DATABASE: nadi
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping --host=127.0.0.1 --password=root"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10

    env:
      APP_ENV: testing
      DB_CONNECTION: mysql
      DB_HOST: 127.0.0.1
      DB_PORT: 3306
      DB_DATABASE: nadi
      DB_USERNAME: root
      DB_PASSWORD: root

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.4'
          extensions: bcmath, curl, gd, intl, mbstring, pdo_mysql, xml, zip
          coverage: none

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.24.x'

      - name: Install Composer dependencies
        run: composer install --no-interaction --prefer-dist --no-progress

      - name: Prepare application environment
        run: |
          cp .env.example .env
          php artisan key:generate

      - name: Load approved Central baseline schema
        run: mysql --host=127.0.0.1 --port=3306 --user=root --password=root nadi < database/schema/nadi-baseline.sql

      - name: Apply all Central migrations
        run: php artisan migrate --force

      - name: Run automated tests
        run: php artisan test

      - name: Verify Agent Ed25519 compatibility
        working-directory: tests/AgentCompatibility
        run: go test ./...
